name: Docker-Builder-Debian

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/docker-debian.yml
      - docker/**
      - agents/**
      - package.json
      - package-lock.json
  schedule:
    - cron: '0 1 * * *' # Daily at 01:00 UTC (I think)
  release:
    types: [ published ]

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    name: Run Translations
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
      - name: Test agent UI automation logic
        run: node agents/win-uiautomation-mocktest.js
      - name: Run translate.js (ignore errors)
        run: node translate.js || true
        working-directory: translate
      - name: Run translate extractall
        run: node translate extractall
        working-directory: translate
      - name: Run translate.js minifyall
        run: node translate.js minifyall
        working-directory: translate
      - name: Run translate.js translateall
        run: node translate.js translateall
        working-directory: translate
      - name: Upload repo with translations
        uses: actions/upload-artifact@v7
        with:
          name: repo-with-preparations
          path: ./
  build-images:
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - variant: mongodb
            suffix: -mongodb-debian
            postgresql: false
            mongodb: true
            mariadb: false
          - variant: postgresql
            suffix: -postgresql-debian
            postgresql: true
            mongodb: false
            mariadb: false
          - variant: mariadb
            suffix: -mariadb-debian
            postgresql: false
            mongodb: false
            mariadb: true
          - variant: complete
            suffix: -debian
            postgresql: true
            mongodb: true
            mariadb: true
          - variant: slim
            suffix: -slim-debian
            postgresql: false
            mongodb: false
            mariadb: false
    name: Build Docker Image (${{ matrix.variant }})
    steps:
      - name: Download repo artifact
        uses: actions/download-artifact@v8
        with:
          name: repo-with-preparations
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          cache-image: false
          platforms: linux/amd64,linux/arm64,linux/arm/v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          cache-binary: false
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize GitHub image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: compile metadata information
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ steps.image.outputs.name }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch,suffix=${{ matrix.suffix }}
            type=ref,event=tag,suffix=${{ matrix.suffix }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/') }},suffix=${{ matrix.suffix }}
            type=sha,suffix=${{ matrix.suffix }}
      - name: Build and push Docker image (${{ matrix.variant }})
        uses: docker/build-push-action@v7
        with:
          push: ${{ github.event_name != 'pull_request' }}
          context: .
          file: ./docker/Dockerfile-debian
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            DISABLE_MINIFY=yes
            DISABLE_TRANSLATE=yes
            DISABLE_EXTRACT=yes
            INCLUDE_MONGODB_TOOLS=${{ matrix.mongodb }}
            INCLUDE_POSTGRESQL_TOOLS=${{ matrix.postgresql }}
            INCLUDE_MARIADB_TOOLS=${{ matrix.mariadb }}
  rerun-on-failure:
    needs: build-images
    if: failure() && fromJSON(github.run_attempt) < 3
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ github.head_ref || github.ref_name }}
          FAILED_RUN_ID: ${{ github.run_id }}
        run: gh workflow run rerun.yaml -r "$WORKFLOW_REF" -F "run_id=$FAILED_RUN_ID"

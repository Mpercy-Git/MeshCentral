name: Docker-GHCR

# Builds the Docker image and publishes it to this repository's GitHub Container
# Registry namespace. Unlike docker-alpine.yml / docker-debian.yml this pushes only
# to ghcr.io, so it needs no Docker Hub secrets and works in a fork as-is.
#
# Defaults to linux/amd64 and the slim variant to keep runs to a few minutes.
# Use the workflow_dispatch inputs for multi-arch or database-tool builds.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Target platforms'
        required: false
        default: 'linux/amd64'
        type: choice
        options:
          - 'linux/amd64'
          - 'linux/amd64,linux/arm64'
      db_tools:
        description: 'Include database client tools (mongodb, postgresql, mariadb)'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - master
      - 'claude/**'
    tags:
      - 'v*'
  release:
    types: [ published ]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push to ghcr.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        if: contains(inputs.platforms, 'arm')
        uses: docker/setup-qemu-action@v3
        with:
          cache-image: false
          platforms: ${{ inputs.platforms }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          cache-binary: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile metadata information
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/meshcentral
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: ./docker/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DISABLE_MINIFY=yes
            DISABLE_TRANSLATE=yes
            DISABLE_EXTRACT=yes
            INCLUDE_MONGODB_TOOLS=${{ inputs.db_tools || false }}
            INCLUDE_POSTGRESQL_TOOLS=${{ inputs.db_tools || false }}
            INCLUDE_MARIADB_TOOLS=${{ inputs.db_tools || false }}

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo ""
            echo "Platforms: \`${{ inputs.platforms || 'linux/amd64' }}\`"
            echo ""
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Pull with:"
            echo '```sh'
            echo "docker pull $(echo "${{ steps.meta.outputs.tags }}" | head -n1)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

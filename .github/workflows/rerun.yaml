name: Rerun failed workflow

on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
permissions:
  actions: write
  contents: read

jobs:
  rerun:
    runs-on: ubuntu-latest
    steps:
      - name: rerun ${{ inputs.run_id }}
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          FAILED_RUN_ID: ${{ inputs.run_id }}
        run: |
          gh run watch "$FAILED_RUN_ID" > /dev/null 2>&1
          gh run rerun "$FAILED_RUN_ID" --failed

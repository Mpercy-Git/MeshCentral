name: Release

# Disabled in this fork: this workflow cuts MeshCentral's own releases. Merging from
# upstream bumps package.json, which fired it here and made it try to create a duplicate
# release for the upstream version number. It also needs "contents: write", which the
# fork's read-only default token does not grant, so it failed with HTTP 403.
# The automatic trigger is removed; run it by hand if a fork release is ever wanted
# (that also needs a permissions block granting contents: write).
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - master
  #   paths:
  #     - 'package.json'

jobs:
  build:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Release
        uses: SerenModz21/github-action-npm-release@master
        id: release
      - name: Print release output
        if: ${{ steps.release.outputs.released == 'true' }}
        run: echo Release ID ${{ steps.release.outputs.release_id }}
      - name: Trigger Docker builds
        if: ${{ steps.release.outputs.released == 'true' }}
        # docker-alpine.yml and docker-debian.yml are disabled in this fork: they push to
        # Docker Hub and need secrets that are not configured here. Build to ghcr.io instead.
        run: |
          gh workflow run docker-ghcr.yml -r ${{ steps.release.outputs.release_tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
